[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/var/run/supervisord.pid

[program:pm2]
command=/usr/local/bin/pm2 resurrect
directory=/workspace
user=node
autostart=true
autorestart=true
startsecs=2
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pm2-webui]
command=/usr/local/bin/npm start
directory=/opt/pm2-webui
user=node
environment=HOST="0.0.0.0",PORT="4343",PM2_HOME="/home/node/.pm2"
autostart=true
autorestart=true
startsecs=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
